name: Playwright Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runs the smoke and regression suites as two parallel jobs.
    # Tests must be independent (own data, no shared state) so they are safe to run concurrently.
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-jammy
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regression]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Ensure every test is tagged
        if: matrix.suite == 'smoke'
        run: |
          OUT=$(npx playwright test --list --grep-invert "@smoke|@regression" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "Total: 0 tests" || { echo "Found tests without @smoke or @regression tag"; exit 1; }

      - name: Run ${{ matrix.suite }} tests
        run: npx playwright test --grep "@${{ matrix.suite }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 14

  report:
    # Merge the results of both suites into a single Allure report
    needs: test
    if: ${{ always() && needs.test.result != 'cancelled' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  deploy-report:
    # Publish the Allure report to GitHub Pages (main branch only)
    needs: report
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [test, report, deploy-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          subject: "Playwright tests ${{ needs.test.result }}: ${{ github.repository }} @ ${{ github.ref_name }}"
          body: |
            Playwright test run (smoke + regression) finished with status: ${{ needs.test.result }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Allure report (GitHub Pages, main only): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            The merged Allure report is also attached to the run as the "allure-report" artifact.
